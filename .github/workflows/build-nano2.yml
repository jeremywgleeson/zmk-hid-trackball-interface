name: Build Ploopy Nano 2 Firmware

on:
  push:
    branches: [nano2-support, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QMK
        run: python3 -m pip install qmk

      - name: Setup QMK
        run: |
          qmk setup -y -H $HOME/qmk_firmware
          qmk doctor || true

      - name: Copy keymap
        run: |
          cp -r trackball_firmware/qmk/keyboards/ploopyco/nano_2/keymaps/lkbm \
            $HOME/qmk_firmware/keyboards/ploopyco/nano_2/keymaps/lkbm
          ls -la $HOME/qmk_firmware/keyboards/ploopyco/nano_2/
          ls -la $HOME/qmk_firmware/keyboards/ploopyco/nano_2/keymaps/

      - name: Compile
        run: |
          cd $HOME/qmk_firmware
          make ploopyco/nano_2:lkbm

      - name: Find firmware
        run: find $HOME/qmk_firmware -name "*.uf2" -o -name "*.bin" -o -name "*.hex" 2>/dev/null | head -20

      - name: Copy firmware
        run: cp $HOME/qmk_firmware/*.uf2 $GITHUB_WORKSPACE/ 2>/dev/null || cp $HOME/qmk_firmware/.build/*.uf2 $GITHUB_WORKSPACE/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ploopy_nano_2_lkbm
          path: "*.uf2"
