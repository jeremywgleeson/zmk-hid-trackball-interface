name: Build Ploopy Nano 2 Firmware

on:
  push:
    branches: [nano2-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QMK
        run: |
          qmk setup -y -H /home/runner/qmk_firmware

      - name: Copy keymap
        run: |
          cp -r trackball_firmware/qmk/keyboards/ploopyco/nano_2/keymaps/lkbm \
            /home/runner/qmk_firmware/keyboards/ploopyco/nano_2/keymaps/lkbm

      - name: Compile
        run: |
          cd /home/runner/qmk_firmware
          qmk compile -kb ploopyco/nano_2 -km lkbm

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ploopy_nano_2_lkbm
          path: /home/runner/qmk_firmware/*.uf2
