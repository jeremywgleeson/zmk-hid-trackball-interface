name: Build Ploopy Nano 2 Firmware

on:
  push:
    branches: [nano2-support, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QMK
        run: python3 -m pip install qmk

      - name: Install ARM toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          sudo tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/
          echo "/opt/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Setup QMK
        run: |
          qmk setup -y -H $HOME/qmk_firmware

      - name: Copy keymap
        run: |
          cp -r trackball_firmware/qmk/keyboards/ploopyco/nano_2/keymaps/lkbm \
            $HOME/qmk_firmware/keyboards/ploopyco/nano_2/keymaps/lkbm

      - name: Compile
        run: |
          cd $HOME/qmk_firmware
          make ploopyco/nano_2/rev2_003:lkbm

      - name: Copy firmware
        run: |
          find $HOME/qmk_firmware -name "*.uf2" | head -5
          cp $HOME/qmk_firmware/*.uf2 $GITHUB_WORKSPACE/ 2>/dev/null || cp $HOME/qmk_firmware/.build/*.uf2 $GITHUB_WORKSPACE/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ploopy_nano_2_lkbm
          path: "*.uf2"
